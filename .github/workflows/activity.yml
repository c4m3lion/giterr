name: Scheduled activity update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update activity log
        run: python scripts/update_activity.py

      - name: Commit activity update
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add activity-log.md
          if git diff --cached --quiet; then
            echo "No activity changes to commit."
            exit 0
          fi
          git commit -m "chore: update activity log"
          git push
